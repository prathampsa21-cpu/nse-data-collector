name: Daily NSE 1-Min Data Collector

on:
  schedule:
    # Runs at 10:30 UTC = 4:00 PM IST (Mon-Fri)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual run anytime

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance pyarrow pytz

      - name: Run Collector Script
        run: |
          python collector.py

      - name: Commit and Push Data to Repo
        run: |
          git config --global user.name "NSE Data Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/
          if git status --porcelain | grep -q "data/"; then
            TODAY=$(date -u +"%Y-%m-%d")
            git commit -m "Add NSE 1-min data for $TODAY [skip ci]"
            git push
          else
            echo "No new data to commit."
          fi
